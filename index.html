<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/9mG1MVP1/20260417-114358-0000.png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/9mG1MVP1/20260417-114358-0000.png" />
    <title>Prof. Corujão</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
      }

      #splash-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: #374151;
        letter-spacing: 0.02em;
      }

      #splash-bar-track {
        margin-top: 10px;
        width: 220px;
        max-width: 68vw;
        height: 22px;
        border: 2.5px solid #6366f1;
        border-radius: 4px;
        background: #ffffff;
        overflow: hidden;
        padding: 3px;
      }

      #splash-bar {
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #8b5cf6);
        width: 0%;
        border-radius: 2px;
        animation: splashBarFill 2.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      @keyframes splashBarFill {
        0%   { width: 0% }
        30%  { width: 55% }
        60%  { width: 78% }
        85%  { width: 89% }
        100% { width: 92% }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <p id="splash-label">Carregando...</p>
      <div id="splash-bar-track">
        <div id="splash-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
